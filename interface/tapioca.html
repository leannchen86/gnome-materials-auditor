<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tapioca Pearl Microstructure</title>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<style>
:root {
  --ink: #202422;
  --muted: #617169;
  --field: #181a1c;
  --field-ink: #f8f0db;
  --field-muted: rgba(248, 240, 219, 0.76);
  --panel: rgba(255, 249, 237, 0.9);
  --panel-strong: #fff9ed;
  --line: rgba(42, 39, 33, 0.16);
  --warm: #e07b50;
  --heat: #ea5f43;
  --cold: #7fb9d6;
  --water: #42d9f5;
  --gel: #4fe0a1;
  --crystal: #f0b24a;
  --stress: #ff5c8a;
  --shadow: 0 18px 50px rgba(0, 0, 0, 0.24);
}

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Liberation Sans", sans-serif;
  color: var(--field-ink);
  background: var(--field);
}

button,
input {
  font: inherit;
}

#scene {
  position: fixed;
  inset: 0;
  z-index: 0;
}

.grain {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  opacity: 0.3;
  background-image:
    linear-gradient(rgba(184, 243, 255, 0.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(248, 240, 219, 0.035) 1px, transparent 1px);
  background-size: 44px 44px;
  mask-image: linear-gradient(90deg, transparent 0%, #000 18%, #000 82%, transparent 100%);
}

.shell {
  position: relative;
  z-index: 2;
  min-height: 100dvh;
  padding: 22px;
  pointer-events: none;
}

.topbar {
  display: grid;
  grid-template-columns: minmax(250px, 1fr) auto minmax(250px, 1fr);
  gap: 18px;
  align-items: start;
}

.brand,
.controls,
.readout {
  min-width: 0;
  pointer-events: auto;
}

.brand {
  max-width: 420px;
  text-shadow: 0 2px 22px rgba(0, 0, 0, 0.42);
}

.eyebrow {
  margin: 0 0 5px;
  font-size: 12px;
  font-weight: 700;
  color: var(--warm);
  text-transform: uppercase;
  letter-spacing: 0;
}

h1 {
  margin: 0;
  font-size: clamp(28px, 4vw, 54px);
  line-height: 0.96;
  font-weight: 760;
}

.lede {
  max-width: 360px;
  margin: 12px 0 0;
  color: var(--field-muted);
  font-size: 14px;
  line-height: 1.42;
}

.controls {
  width: min(440px, calc(100vw - 44px));
  background: var(--panel);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 8px;
  box-shadow: var(--shadow);
  backdrop-filter: blur(18px);
  overflow: hidden;
}

.modebar {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  border-bottom: 1px solid var(--line);
}

.modebar button {
  min-width: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  height: 44px;
  padding: 0 10px;
  border: 0;
  border-right: 1px solid var(--line);
  color: var(--ink);
  background: rgba(255, 253, 248, 0.72);
  cursor: pointer;
  white-space: nowrap;
}

.modebar button:last-child {
  border-right: 0;
}

.modebar button:hover {
  background: #ffffff;
}

.modebar button.active {
  color: #fff;
  background: var(--ink);
}

.modebar svg {
  width: 17px;
  height: 17px;
  flex: 0 0 auto;
}

.control-body {
  display: grid;
  gap: 14px;
  padding: 16px;
}

.field {
  display: grid;
  grid-template-columns: 178px minmax(0, 1fr);
  gap: 12px;
  align-items: center;
}

.field label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  font-size: 12px;
  font-weight: 720;
  color: var(--muted);
}

.field .value {
  text-align: right;
  flex: 0 0 auto;
  font-size: 12px;
  color: var(--ink);
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}

input[type="range"] {
  width: 100%;
  min-width: 0;
  height: 28px;
  accent-color: var(--warm);
}

.toggles {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.tool-btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  height: 34px;
  padding: 0 12px;
  border: 1px solid var(--line);
  border-radius: 6px;
  color: var(--ink);
  background: var(--panel-strong);
  cursor: pointer;
}

.tool-btn:hover {
  border-color: rgba(32, 36, 34, 0.32);
}

.tool-btn.active {
  color: #fff;
  border-color: var(--ink);
  background: var(--ink);
}

.tool-btn svg {
  width: 16px;
  height: 16px;
}

.readout {
  justify-self: end;
  width: min(330px, calc(100vw - 44px));
  background: var(--panel);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 8px;
  box-shadow: var(--shadow);
  backdrop-filter: blur(18px);
  padding: 16px;
}

.readout h2 {
  margin: 0 0 12px;
  font-size: 15px;
  font-weight: 760;
}

.metrics {
  display: grid;
  gap: 11px;
}

.metric {
  display: grid;
  grid-template-columns: 112px 1fr 42px;
  gap: 10px;
  align-items: center;
}

.metric span {
  font-size: 12px;
  color: var(--muted);
}

.meter {
  min-width: 0;
  height: 9px;
  border-radius: 999px;
  background: rgba(32, 36, 34, 0.1);
  overflow: hidden;
}

.meter i {
  display: block;
  width: 0%;
  height: 100%;
  border-radius: inherit;
  background: var(--gel);
  transition: width 220ms ease;
}

.meter.water i {
  background: var(--water);
}

.meter.crystal i {
  background: var(--crystal);
}

.metric b {
  text-align: right;
  font-size: 12px;
  font-variant-numeric: tabular-nums;
}

.note {
  margin: 14px 0 0;
  min-height: 32px;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.42;
}

.legend {
  position: absolute;
  left: 22px;
  bottom: 22px;
  width: min(520px, calc(100vw - 44px));
  pointer-events: auto;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
}

.chip {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 40px;
  padding: 9px 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: rgba(255, 249, 237, 0.84);
  backdrop-filter: blur(14px);
  box-shadow: 0 8px 24px rgba(40, 38, 33, 0.1);
  font-size: 12px;
  color: var(--muted);
}

.swatch {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  flex: 0 0 auto;
}

.swatch.chain {
  background: var(--gel);
}

.swatch.water {
  background: var(--water);
}

.swatch.crystal {
  background: var(--crystal);
}

@media (max-width: 1040px) {
  .topbar {
    grid-template-columns: 1fr;
  }

  .controls,
  .readout {
    justify-self: start;
  }

  .readout {
    width: min(440px, calc(100vw - 44px));
  }

  .legend {
    position: static;
    margin-top: 14px;
  }

  .shell {
    overflow: auto;
    max-height: 100dvh;
  }
}

@media (max-width: 640px) {
  .shell {
    padding: 14px;
  }

  .topbar {
    gap: 12px;
  }

  h1 {
    font-size: 34px;
  }

  .controls,
  .readout,
  .legend {
    width: calc(100vw - 48px);
    max-width: 440px;
  }

  .controls {
    margin-top: min(26vh, 210px);
  }

  .modebar {
    grid-template-columns: 1fr;
  }

  .modebar button {
    border-right: 0;
    border-bottom: 1px solid var(--line);
  }

  .modebar button:last-child {
    border-bottom: 0;
  }

  .field {
    display: block;
    position: relative;
    width: calc(100vw - 82px);
    max-width: 392px;
    min-width: 0;
  }

  .field label {
    display: block;
    min-height: 18px;
    padding-right: 74px;
  }

  .field .value {
    position: absolute;
    top: 0;
    right: 48px;
  }

  .field input {
    display: block;
    width: 100%;
    margin-top: 7px;
  }

  .legend {
    grid-template-columns: 1fr 1fr;
  }
}
</style>
</head>
<body>
<canvas id="scene" aria-label="3D tapioca pearl starch microstructure"></canvas>
<div class="grain" aria-hidden="true"></div>

<main class="shell">
  <section class="topbar" aria-label="Tapioca pearl starch material state">
    <div class="brand">
      <p class="eyebrow">Starch-water material response</p>
      <h1>Tapioca Pearl Microstructure</h1>
      <p class="lede">Cooked starch is a hydrated gel. Cold storage orders some chains and immobilizes water.</p>
    </div>

    <div class="controls" aria-label="State controls">
      <div class="modebar" role="group" aria-label="Preset states">
        <button class="mode active" type="button" data-mode="cooked">
          <i data-lucide="flame"></i><span>Cooked</span>
        </button>
        <button class="mode" type="button" data-mode="fridge">
          <i data-lucide="snowflake"></i><span>Fridge</span>
        </button>
        <button class="mode" type="button" data-mode="microwave">
          <i data-lucide="waves"></i><span>Microwave</span>
        </button>
      </div>

      <div class="control-body">
        <div class="field">
          <label for="temperature">Temperature <span class="value" id="temperatureValue">72 deg C</span></label>
          <input id="temperature" type="range" min="4" max="95" value="72" step="1">
        </div>
        <div class="field">
          <label for="hydration">Syrup hydration <span class="value" id="hydrationValue">74%</span></label>
          <input id="hydration" type="range" min="20" max="100" value="74" step="1">
        </div>
        <div class="field">
          <label for="coldTime">Cold aging <span class="value" id="coldTimeValue">0 h</span></label>
          <input id="coldTime" type="range" min="0" max="24" value="0" step="1">
        </div>
        <div class="toggles" role="group" aria-label="View options">
          <button id="cutawayBtn" class="tool-btn active" type="button">
            <i data-lucide="scan-eye"></i><span>Cutaway</span>
          </button>
          <button id="motionBtn" class="tool-btn active" type="button">
            <i data-lucide="activity"></i><span>Motion</span>
          </button>
          <button id="resetBtn" class="tool-btn" type="button">
            <i data-lucide="rotate-ccw"></i><span>Reset</span>
          </button>
        </div>
      </div>
    </div>

    <aside class="readout" aria-label="Material metrics">
      <h2 id="stateTitle">Cooked pearl: gelatinized starch gel</h2>
      <div class="metrics">
        <div class="metric">
          <span>Chewiness</span>
          <div class="meter gel"><i id="chewMeter"></i></div>
          <b id="chewValue">0%</b>
        </div>
        <div class="metric">
          <span>Water mobility</span>
          <div class="meter water"><i id="waterMeter"></i></div>
          <b id="waterValue">0%</b>
        </div>
        <div class="metric">
          <span>Ordered domains</span>
          <div class="meter crystal"><i id="crystalMeter"></i></div>
          <b id="crystalValue">0%</b>
        </div>
      </div>
      <p id="stateNote" class="note"></p>
    </aside>
  </section>

  <section class="legend" aria-label="Visual key">
    <div class="chip"><span class="swatch chain"></span>Starch chains</div>
    <div class="chip"><span class="swatch water"></span>Mobile water</div>
    <div class="chip"><span class="swatch crystal"></span>Retrograded domains</div>
  </section>
</main>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

const palette = {
  field: 0x181a1c,
  fog: 0x181a1c,
  floor: 0x111316,
  gridMajor: 0x3b666b,
  gridMinor: 0x5b4937,
  pearlShell: 0xf3cfa8,
  pearlShellCold: 0xd9b98f,
  pearlGel: 0xf6ddb8,
  gel: 0x4fe0a1,
  gelCold: 0x9fb86a,
  water: 0x42d9f5,
  waterCore: 0xd5fbff,
  crystal: 0xf0b24a,
  stress: 0xff5c8a,
  rim: 0xb8f3ff
};

const canvas = document.querySelector("#scene");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.16;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(palette.field);
scene.fog = new THREE.Fog(palette.fog, 8.4, 16);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 1.1, 8.6);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  0.42,
  0.54,
  0.78
);
composer.addPass(bloomPass);
composer.addPass(new OutputPass());

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.minDistance = 5.1;
controls.maxDistance = 12;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.34;
controls.target.set(0, 0, 0);

const pearlGroup = new THREE.Group();
pearlGroup.rotation.set(-0.1, -0.3, 0.02);
scene.add(pearlGroup);

const ambient = new THREE.HemisphereLight(0xdaf6ff, 0x5c4434, 1.55);
scene.add(ambient);

const keyLight = new THREE.DirectionalLight(0xfff0cf, 2.9);
keyLight.position.set(4.4, 5.4, 6.2);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(palette.water, 1.9);
rimLight.position.set(-5, 2.2, -3);
scene.add(rimLight);

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(9.8, 96),
  new THREE.MeshStandardMaterial({
    color: palette.floor,
    roughness: 0.92,
    metalness: 0,
    transparent: true,
    opacity: 0.66
  })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -3.06;
floor.receiveShadow = true;
scene.add(floor);

const grid = new THREE.GridHelper(18, 36, palette.gridMajor, palette.gridMinor);
grid.position.y = -3.045;
grid.material.transparent = true;
grid.material.opacity = 0.24;
scene.add(grid);

const clippingPlane = new THREE.Plane(new THREE.Vector3(1, 0, -0.18).normalize(), 0.82);
renderer.localClippingEnabled = true;

const pearlRadius = 2.58;
const vfxUniforms = {
  uTime: { value: 0 },
  uWater: { value: 0.82 },
  uCrystal: { value: 0.06 },
  uStress: { value: 0.07 },
  uGelColor: { value: new THREE.Color(palette.gel) },
  uWaterColor: { value: new THREE.Color(palette.water) },
  uCrystalColor: { value: new THREE.Color(palette.crystal) },
  uStressColor: { value: new THREE.Color(palette.stress) }
};

const pearlAuraMaterial = new THREE.ShaderMaterial({
  uniforms: vfxUniforms,
  vertexShader: `
    varying vec3 vNormal;
    varying vec3 vView;

    void main() {
      vNormal = normalize(normalMatrix * normal);
      vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
      vView = normalize(-mvPosition.xyz);
      gl_Position = projectionMatrix * mvPosition;
    }
  `,
  fragmentShader: `
    uniform float uTime;
    uniform float uWater;
    uniform float uCrystal;
    uniform float uStress;
    uniform vec3 uGelColor;
    uniform vec3 uWaterColor;
    uniform vec3 uCrystalColor;
    uniform vec3 uStressColor;
    varying vec3 vNormal;
    varying vec3 vView;

    void main() {
      float rim = pow(1.0 - abs(dot(normalize(vNormal), normalize(vView))), 2.4);
      float bands = 0.5 + 0.5 * sin(vNormal.y * 18.0 + vNormal.x * 7.0 + uTime * 0.65);
      vec3 hydrated = mix(uGelColor, uWaterColor, 0.45 + uWater * 0.25);
      vec3 aged = mix(uCrystalColor, uStressColor, clamp(uStress * 1.25, 0.0, 1.0));
      vec3 color = mix(hydrated, aged, clamp(uCrystal * 1.2, 0.0, 1.0)) * 1.35;
      float alpha = (rim * 0.18 + bands * uStress * 0.028) * (0.7 + uWater * 0.3);
      gl_FragColor = vec4(color, alpha);
    }
  `,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  side: THREE.BackSide
});

const shellMaterial = new THREE.MeshPhysicalMaterial({
  color: palette.pearlShell,
  roughness: 0.34,
  metalness: 0,
  transmission: 0.15,
  transparent: true,
  opacity: 0.27,
  thickness: 0.6,
  clearcoat: 0.62,
  clearcoatRoughness: 0.28,
  side: THREE.DoubleSide,
  clippingPlanes: [clippingPlane],
  clipShadows: true
});

const shell = new THREE.Mesh(new THREE.SphereGeometry(pearlRadius, 96, 64), shellMaterial);
shell.castShadow = true;
shell.receiveShadow = true;
pearlGroup.add(shell);

const pearlAura = new THREE.Mesh(new THREE.SphereGeometry(pearlRadius * 1.035, 96, 64), pearlAuraMaterial);
pearlGroup.add(pearlAura);

const innerMaterial = new THREE.MeshPhysicalMaterial({
  color: palette.pearlGel,
  roughness: 0.68,
  metalness: 0,
  transparent: true,
  opacity: 0.18,
  side: THREE.BackSide,
  clippingPlanes: [clippingPlane]
});

const innerGlow = new THREE.Mesh(new THREE.SphereGeometry(pearlRadius * 0.965, 64, 40), innerMaterial);
pearlGroup.add(innerGlow);

const cutawayMaterial = new THREE.ShaderMaterial({
  uniforms: vfxUniforms,
  vertexShader: `
    varying vec2 vUv;

    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform float uTime;
    uniform float uWater;
    uniform float uCrystal;
    uniform float uStress;
    uniform vec3 uGelColor;
    uniform vec3 uWaterColor;
    uniform vec3 uCrystalColor;
    uniform vec3 uStressColor;
    varying vec2 vUv;

    void main() {
      vec2 p = vUv - 0.5;
      float r = length(p) * 2.0;
      float edge = 1.0 - smoothstep(0.82, 1.0, r);
      float strands = 0.5 + 0.5 * sin(p.x * 22.0 + p.y * 13.0 + uTime * (0.22 + uWater * 0.28));
      float pools = 0.5 + 0.5 * sin(p.x * 9.0 - p.y * 17.0 - uTime * 0.18);
      float mottle = smoothstep(0.18, 0.86, strands * pools + uCrystal * 0.24);
      vec3 gel = mix(uGelColor, uWaterColor, 0.38 + uWater * 0.32);
      vec3 ordered = mix(uCrystalColor, uStressColor, clamp(uStress * 0.28, 0.0, 1.0));
      vec3 color = mix(gel, ordered, clamp(uCrystal * (0.55 + mottle * 0.48), 0.0, 0.92)) * 1.18;
      float alpha = edge * (0.032 + uWater * 0.028 + uCrystal * mottle * 0.062);
      gl_FragColor = vec4(color, alpha);
    }
  `,
  transparent: true,
  depthWrite: false,
  blending: THREE.NormalBlending,
  side: THREE.DoubleSide
});

const crossSection = new THREE.Mesh(
  new THREE.CircleGeometry(pearlRadius * 0.97, 96),
  cutawayMaterial
);
crossSection.position.set(-0.72, 0, 0.13);
crossSection.rotation.y = Math.PI / 2 - 0.18;
pearlGroup.add(crossSection);

const outerRim = new THREE.Mesh(
  new THREE.TorusGeometry(pearlRadius * 0.994, 0.018, 10, 144),
  new THREE.MeshBasicMaterial({
    color: palette.rim,
    transparent: true,
    opacity: 0.5,
    depthTest: false,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  })
);
outerRim.rotation.y = Math.PI / 2 - 0.18;
outerRim.position.copy(crossSection.position);
pearlGroup.add(outerRim);

function clamp(value, min = 0, max = 1) {
  return Math.min(max, Math.max(min, value));
}

function smoothstep(edge0, edge1, value) {
  const x = clamp((value - edge0) / (edge1 - edge0));
  return x * x * (3 - 2 * x);
}

function rand(min, max) {
  return min + Math.random() * (max - min);
}

function pointInSphere(radius) {
  let point;
  do {
    point = new THREE.Vector3(rand(-1, 1), rand(-1, 1), rand(-1, 1));
  } while (point.lengthSq() > 1);
  return point.multiplyScalar(radius);
}

function makeCurlPoints(seed, count, radius) {
  const points = [];
  const base = pointInSphere(radius * 0.48);
  const axisA = pointInSphere(1).normalize();
  const axisB = new THREE.Vector3().crossVectors(axisA, new THREE.Vector3(0.2, 1, 0.1)).normalize();
  const axisC = new THREE.Vector3().crossVectors(axisA, axisB).normalize();
  const twist = rand(1.1, 2.8);
  const length = rand(1.4, 3.2);
  const wobble = rand(0.12, 0.34);
  for (let i = 0; i < count; i += 1) {
    const t = i / (count - 1);
    const angle = t * Math.PI * 2 * twist + seed;
    const along = (t - 0.5) * length;
    const radial = 0.34 + Math.sin(seed + t * Math.PI) * 0.14;
    const p = base.clone()
      .add(axisA.clone().multiplyScalar(along))
      .add(axisB.clone().multiplyScalar(Math.cos(angle) * radial))
      .add(axisC.clone().multiplyScalar(Math.sin(angle) * radial * 0.58))
      .add(pointInSphere(wobble));
    if (p.length() > radius) p.setLength(radius * 0.96);
    points.push(p);
  }
  return points;
}

function makeRetroPoints(seed, count, radius) {
  const points = [];
  const center = pointInSphere(radius * 0.45);
  const axis = pointInSphere(1).normalize();
  const side = new THREE.Vector3().crossVectors(axis, new THREE.Vector3(0.1, 1, 0.3)).normalize();
  const up = new THREE.Vector3().crossVectors(axis, side).normalize();
  const length = rand(1.0, 2.35);
  for (let i = 0; i < count; i += 1) {
    const t = i / (count - 1);
    const ladder = Math.round((t - 0.5) * 10) / 10;
    const angle = seed + t * Math.PI * 8;
    const p = center.clone()
      .add(axis.clone().multiplyScalar(ladder * length))
      .add(side.clone().multiplyScalar(Math.cos(angle) * 0.08))
      .add(up.clone().multiplyScalar(Math.sin(angle) * 0.08));
    if (p.length() > radius) p.setLength(radius * 0.93);
    points.push(p);
  }
  return points;
}

const chainGroup = new THREE.Group();
pearlGroup.add(chainGroup);

const chainData = [];
const chainCount = 22;
const pointsPerChain = 56;
const softChainColor = new THREE.Color(palette.gel);
const coldChainColor = new THREE.Color(palette.gelCold);

for (let i = 0; i < chainCount; i += 1) {
  const seed = rand(0, Math.PI * 2);
  const soft = makeCurlPoints(seed, pointsPerChain, pearlRadius * 0.82);
  const retro = makeRetroPoints(seed, pointsPerChain, pearlRadius * 0.82);
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.Float32BufferAttribute(new Float32Array(pointsPerChain * 3), 3));
  const material = new THREE.LineBasicMaterial({
    color: softChainColor,
    transparent: true,
    opacity: 0.54,
    depthTest: false,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });
  const line = new THREE.Line(geometry, material);
  line.renderOrder = 4;
  chainGroup.add(line);
  chainData.push({ soft, retro, line, phase: seed });
}

const nodeGeometry = new THREE.SphereGeometry(0.038, 12, 8);
const nodeMaterial = new THREE.MeshStandardMaterial({
  color: palette.gel,
  emissive: palette.gel,
  emissiveIntensity: 0.22,
  roughness: 0.52,
  transparent: true,
  opacity: 0.56,
  depthTest: false
});
const chainNodes = new THREE.InstancedMesh(nodeGeometry, nodeMaterial, chainCount * 5);
chainNodes.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
chainNodes.renderOrder = 4;
pearlGroup.add(chainNodes);

const waterCount = 78;
const waterGeometry = new THREE.SphereGeometry(0.045, 16, 10);
const waterMaterial = new THREE.MeshStandardMaterial({
  color: palette.water,
  emissive: palette.water,
  emissiveIntensity: 0.5,
  roughness: 0.28,
  metalness: 0,
  transparent: true,
  opacity: 0.72,
  depthTest: false
});
const waterMesh = new THREE.InstancedMesh(waterGeometry, waterMaterial, waterCount);
waterMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
waterMesh.renderOrder = 5;
pearlGroup.add(waterMesh);

const waterData = Array.from({ length: waterCount }, () => ({
  position: pointInSphere(pearlRadius * 0.82),
  velocity: pointInSphere(0.008),
  phase: rand(0, Math.PI * 2),
  scale: rand(0.7, 1.35)
}));

const waterPointPositions = new Float32Array(waterCount * 3);
const waterPointSizes = new Float32Array(waterCount);
const waterPointPhases = new Float32Array(waterCount);
waterData.forEach((drop, i) => {
  waterPointPositions[i * 3] = drop.position.x;
  waterPointPositions[i * 3 + 1] = drop.position.y;
  waterPointPositions[i * 3 + 2] = drop.position.z;
  waterPointSizes[i] = 0.62 + drop.scale * 0.38;
  waterPointPhases[i] = drop.phase;
});

const waterPointGeometry = new THREE.BufferGeometry();
waterPointGeometry.setAttribute("position", new THREE.Float32BufferAttribute(waterPointPositions, 3));
waterPointGeometry.setAttribute("aSize", new THREE.Float32BufferAttribute(waterPointSizes, 1));
waterPointGeometry.setAttribute("aPhase", new THREE.Float32BufferAttribute(waterPointPhases, 1));
const waterPointMaterial = new THREE.ShaderMaterial({
  uniforms: vfxUniforms,
  vertexShader: `
    uniform float uTime;
    uniform float uWater;
    attribute float aSize;
    attribute float aPhase;
    varying float vPulse;

    void main() {
      vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
      vPulse = 0.72 + 0.28 * sin(uTime * (2.2 + uWater * 3.4) + aPhase);
      gl_PointSize = aSize * (2.6 + uWater * 10.5) * vPulse * (34.0 / max(1.0, -mvPosition.z));
      gl_Position = projectionMatrix * mvPosition;
    }
  `,
  fragmentShader: `
    uniform float uWater;
    uniform vec3 uWaterColor;
    varying float vPulse;

    void main() {
      vec2 p = gl_PointCoord - 0.5;
      float d = length(p);
      float core = smoothstep(0.5, 0.06, d);
      float halo = smoothstep(0.5, 0.22, d) * 0.48;
      float alpha = (core + halo) * (0.04 + uWater * 0.58) * vPulse;
      vec3 color = mix(vec3(0.8, 1.0, 1.0), uWaterColor, 0.72) * 1.8;
      gl_FragColor = vec4(color, alpha);
    }
  `,
  transparent: true,
  depthWrite: false,
  depthTest: false,
  blending: THREE.AdditiveBlending
});
const waterGlow = new THREE.Points(waterPointGeometry, waterPointMaterial);
waterGlow.renderOrder = 6;
pearlGroup.add(waterGlow);

const crystalCount = 40;
const crystalGeometry = new THREE.BoxGeometry(0.38, 0.035, 0.11);
const crystalMaterial = new THREE.MeshStandardMaterial({
  color: palette.crystal,
  emissive: palette.crystal,
  emissiveIntensity: 0.1,
  roughness: 0.48,
  metalness: 0.05,
  transparent: true,
  opacity: 0.04,
  depthTest: false
});
const crystalMesh = new THREE.InstancedMesh(crystalGeometry, crystalMaterial, crystalCount);
crystalMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
crystalMesh.renderOrder = 3;
pearlGroup.add(crystalMesh);

const crystalData = Array.from({ length: crystalCount }, () => ({
  position: pointInSphere(pearlRadius * 0.78),
  rotation: new THREE.Euler(rand(0, Math.PI), rand(0, Math.PI), rand(0, Math.PI)),
  scale: new THREE.Vector3(rand(0.72, 1.35), rand(0.8, 1.2), rand(0.8, 1.5)),
  phase: rand(0, Math.PI * 2)
}));

const matrix = new THREE.Matrix4();
const tempObject = new THREE.Object3D();
const tempColor = new THREE.Color();

const inputs = {
  temperature: document.querySelector("#temperature"),
  hydration: document.querySelector("#hydration"),
  coldTime: document.querySelector("#coldTime")
};

const outputs = {
  temperature: document.querySelector("#temperatureValue"),
  hydration: document.querySelector("#hydrationValue"),
  coldTime: document.querySelector("#coldTimeValue"),
  title: document.querySelector("#stateTitle"),
  note: document.querySelector("#stateNote"),
  chewMeter: document.querySelector("#chewMeter"),
  waterMeter: document.querySelector("#waterMeter"),
  crystalMeter: document.querySelector("#crystalMeter"),
  chewValue: document.querySelector("#chewValue"),
  waterValue: document.querySelector("#waterValue"),
  crystalValue: document.querySelector("#crystalValue")
};

const modeButtons = [...document.querySelectorAll(".mode")];
const cutawayBtn = document.querySelector("#cutawayBtn");
const motionBtn = document.querySelector("#motionBtn");
const resetBtn = document.querySelector("#resetBtn");

const presets = {
  cooked: { temperature: 72, hydration: 74, coldTime: 0 },
  fridge: { temperature: 4, hydration: 48, coldTime: 14 },
  microwave: { temperature: 82, hydration: 68, coldTime: 14 }
};

let selectedMode = "cooked";
let showCutaway = true;
let animateMotion = true;
let current = {
  chewiness: 0.8,
  waterMobility: 0.82,
  crystallinity: 0.06,
  layerStress: 0.07,
  gelation: 0.8,
  reheating: 0.2
};
let target = { ...current };

function computeState() {
  const temperature = Number(inputs.temperature.value);
  const hydration = Number(inputs.hydration.value) / 100;
  const cold = Number(inputs.coldTime.value) / 24;
  const hot = smoothstep(50, 78, temperature);
  const warm = smoothstep(30, 58, temperature);
  const coldRange = 1 - smoothstep(9, 32, temperature);
  const gelation = clamp(smoothstep(58, 76, temperature) * (0.45 + hydration * 0.72));
  const agingHistory = clamp(cold * (1.12 - hydration * 0.56));
  const agingPotential = clamp(coldRange * agingHistory);
  const melt = clamp(smoothstep(52, 90, temperature) * (0.5 + hydration * 0.55));
  const crystallinity = clamp(agingHistory * (1 - 0.72 * melt) + agingPotential * 0.18 + (1 - warm) * cold * 0.04);
  const waterMobility = clamp(0.14 + hot * 0.52 + hydration * 0.45 - crystallinity * 0.48);
  const layerStress = clamp(crystallinity * 0.66 + coldRange * (1 - hydration) * 0.32 - hot * 0.11);
  const chewiness = clamp(0.16 + waterMobility * 0.64 + gelation * 0.26 - crystallinity * 0.45 - layerStress * 0.18);
  const reheating = clamp(hot * cold * (0.5 + hydration * 0.5));

  return {
    temperature,
    hydration,
    cold,
    hot,
    gelation,
    crystallinity,
    waterMobility,
    layerStress,
    chewiness,
    reheating
  };
}

function percent(value) {
  return `${Math.round(clamp(value) * 100)}%`;
}

function classifyState(state) {
  if (state.crystallinity > 0.38 && state.temperature < 38) {
    return {
      phase: "retro",
      title: "Fridge: ordered starch domains",
      note: "Chains reassociate into small crystallites; water becomes less mobile."
    };
  }
  if (state.reheating > 0.38) {
    return {
      phase: "reheat",
      title: "Microwave: partial recovery",
      note: "Heat loosens some ordering and lets water move again."
    };
  }
  return {
    phase: "gel",
    title: "Cooked: hydrated starch gel",
    note: "Swollen starch holds water in a soft disordered network."
  };
}

function updateReadout(state) {
  outputs.temperature.textContent = `${Math.round(state.temperature)} deg C`;
  outputs.hydration.textContent = `${Math.round(state.hydration * 100)}%`;
  outputs.coldTime.textContent = `${Math.round(state.cold * 24)} h`;

  const labels = classifyState(state);
  outputs.title.textContent = labels.title;
  outputs.note.textContent = labels.note;

  outputs.chewMeter.style.width = percent(state.chewiness);
  outputs.waterMeter.style.width = percent(state.waterMobility);
  outputs.crystalMeter.style.width = percent(state.crystallinity);
  outputs.chewValue.textContent = percent(state.chewiness);
  outputs.waterValue.textContent = percent(state.waterMobility);
  outputs.crystalValue.textContent = percent(state.crystallinity);

}

function setMode(mode) {
  selectedMode = mode;
  const preset = presets[mode];
  inputs.temperature.value = preset.temperature;
  inputs.hydration.value = preset.hydration;
  inputs.coldTime.value = preset.coldTime;
  modeButtons.forEach((button) => button.classList.toggle("active", button.dataset.mode === mode));
  target = computeState();
  updateReadout(target);
}

function markCustomMode() {
  selectedMode = "custom";
  modeButtons.forEach((button) => button.classList.remove("active"));
  target = computeState();
  updateReadout(target);
}

modeButtons.forEach((button) => {
  button.addEventListener("click", () => setMode(button.dataset.mode));
});

Object.values(inputs).forEach((input) => {
  input.addEventListener("input", markCustomMode);
});

cutawayBtn.addEventListener("click", () => {
  showCutaway = !showCutaway;
  cutawayBtn.classList.toggle("active", showCutaway);
  shellMaterial.clippingPlanes = showCutaway ? [clippingPlane] : [];
  innerMaterial.clippingPlanes = showCutaway ? [clippingPlane] : [];
  crossSection.visible = showCutaway;
  outerRim.visible = showCutaway;
});

motionBtn.addEventListener("click", () => {
  animateMotion = !animateMotion;
  motionBtn.classList.toggle("active", animateMotion);
  controls.autoRotate = animateMotion;
});

resetBtn.addEventListener("click", () => {
  controls.reset();
  controls.target.set(0, 0, 0);
  camera.position.set(0, 1.1, 8.6);
});

function updateChains(time) {
  const retro = current.crystallinity;
  const water = current.waterMobility;
  const softness = current.chewiness;
  const chainColor = tempColor.copy(softChainColor).lerp(coldChainColor, retro * 0.75);
  let nodeIndex = 0;

  chainData.forEach((chain, chainIndex) => {
    const positions = chain.line.geometry.attributes.position.array;
    const breathe = animateMotion ? Math.sin(time * (0.8 + water) + chain.phase) * 0.035 * water : 0;
    for (let i = 0; i < pointsPerChain; i += 1) {
      const p = chain.soft[i].clone().lerp(chain.retro[i], retro);
      const radial = p.clone().normalize().multiplyScalar(breathe + softness * 0.018 * Math.sin(i * 0.45 + time));
      p.add(radial);
      positions[i * 3] = p.x;
      positions[i * 3 + 1] = p.y;
      positions[i * 3 + 2] = p.z;

      if (i % 14 === 0 && nodeIndex < chainNodes.count) {
        tempObject.position.copy(p);
        tempObject.scale.setScalar(0.72 + softness * 0.55);
        tempObject.updateMatrix();
        chainNodes.setMatrixAt(nodeIndex, tempObject.matrix);
        nodeIndex += 1;
      }
    }
    chain.line.geometry.attributes.position.needsUpdate = true;
    chain.line.material.color.copy(chainColor);
    chain.line.material.opacity = 0.34 + water * 0.28 + softness * 0.22;
    chain.line.visible = showCutaway || chainIndex % 3 !== 0;
  });

  chainNodes.material.color.copy(chainColor);
  chainNodes.material.opacity = 0.32 + water * 0.42;
  chainNodes.instanceMatrix.needsUpdate = true;
}

function updateWater(time, delta) {
  const mobility = current.waterMobility;
  const crystallinity = current.crystallinity;
  const driftScale = animateMotion ? delta * (0.32 + mobility * 2.2) : 0;
  const allowed = pearlRadius * (0.55 + mobility * 0.32);
  const glowPositions = waterPointGeometry.attributes.position.array;

  waterData.forEach((drop, i) => {
    const lockToShell = crystallinity * (0.42 + (i % 5) * 0.045);
    const targetRadius = pearlRadius * (0.46 + lockToShell);
    if (animateMotion) {
      drop.velocity.add(pointInSphere(0.0018 + mobility * 0.006));
      drop.velocity.multiplyScalar(0.88 + mobility * 0.06);
      drop.position.add(drop.velocity.clone().multiplyScalar(driftScale * 55));
      const wave = new THREE.Vector3(
        Math.sin(time * (0.9 + mobility) + drop.phase),
        Math.cos(time * 1.1 + drop.phase * 1.7),
        Math.sin(time * 0.7 + drop.phase * 0.6)
      ).multiplyScalar(0.006 + mobility * 0.018);
      drop.position.add(wave);
    }
    if (drop.position.length() > allowed) {
      drop.position.setLength(allowed);
      drop.velocity.multiplyScalar(-0.38);
    }
    if (crystallinity > 0.25) {
      const shellBias = drop.position.clone().normalize().multiplyScalar(targetRadius);
      drop.position.lerp(shellBias, crystallinity * 0.006);
    }

    tempObject.position.copy(drop.position);
    tempObject.scale.setScalar(drop.scale * (0.28 + mobility * 0.95));
    tempObject.updateMatrix();
    waterMesh.setMatrixAt(i, tempObject.matrix);
    glowPositions[i * 3] = drop.position.x;
    glowPositions[i * 3 + 1] = drop.position.y;
    glowPositions[i * 3 + 2] = drop.position.z;
  });

  waterMaterial.opacity = 0.04 + mobility * 0.42;
  waterMaterial.emissiveIntensity = 0.04 + mobility * 0.5;
  waterMesh.instanceMatrix.needsUpdate = true;
  waterPointGeometry.attributes.position.needsUpdate = true;
}

function updateCrystals(time) {
  const visible = current.crystallinity;
  const meltPulse = current.reheating * 0.08 * Math.sin(time * 4.2);
  crystalData.forEach((crystal, i) => {
    tempObject.position.copy(crystal.position);
    tempObject.rotation.copy(crystal.rotation);
    tempObject.rotateY((animateMotion ? time * 0.04 : 0) + crystal.phase);
    const scale = visible * (1.2 + 0.16 * Math.sin(time + crystal.phase)) - meltPulse;
    tempObject.scale.copy(crystal.scale).multiplyScalar(Math.max(0.02, scale));
    tempObject.updateMatrix();
    crystalMesh.setMatrixAt(i, tempObject.matrix);
  });
  crystalMaterial.opacity = clamp(visible * 0.94 - current.reheating * 0.22, 0, 0.74);
  crystalMaterial.emissiveIntensity = clamp(visible * 0.58 - current.reheating * 0.12, 0, 0.48);
  crystalMesh.instanceMatrix.needsUpdate = true;
}

function updatePearlSurface() {
  vfxUniforms.uWater.value = current.waterMobility;
  vfxUniforms.uCrystal.value = current.crystallinity;
  vfxUniforms.uStress.value = current.layerStress;
  bloomPass.strength = clamp(0.24 + current.waterMobility * 0.22 + current.layerStress * 0.24 + current.reheating * 0.12, 0.24, 0.72);
  bloomPass.radius = clamp(0.3 + current.waterMobility * 0.1 + current.layerStress * 0.12, 0.3, 0.56);
  shellMaterial.opacity = clamp(0.1 + current.crystallinity * 0.22 + (1 - current.waterMobility) * 0.08, 0.1, 0.42);
  shellMaterial.roughness = clamp(0.28 + current.crystallinity * 0.42, 0.25, 0.78);
  shellMaterial.color.setHex(current.crystallinity > 0.28 ? palette.pearlShellCold : palette.pearlShell);
  innerMaterial.opacity = clamp(0.06 + current.waterMobility * 0.07 - current.crystallinity * 0.035, 0.045, 0.14);
  outerRim.material.opacity = showCutaway ? clamp(0.2 + current.waterMobility * 0.28, 0.12, 0.52) : 0;
  pearlAura.scale.setScalar(1 + current.waterMobility * 0.012 + current.layerStress * 0.02);
}

let lastTime = performance.now() / 1000;

function animate() {
  const now = performance.now() / 1000;
  const delta = Math.min(0.035, now - lastTime);
  lastTime = now;
  vfxUniforms.uTime.value = now;

  current.chewiness += (target.chewiness - current.chewiness) * 0.06;
  current.waterMobility += (target.waterMobility - current.waterMobility) * 0.06;
  current.crystallinity += (target.crystallinity - current.crystallinity) * 0.06;
  current.layerStress += (target.layerStress - current.layerStress) * 0.06;
  current.gelation += (target.gelation - current.gelation) * 0.06;
  current.reheating += (target.reheating - current.reheating) * 0.06;

  updateChains(now);
  updateWater(now, delta);
  updateCrystals(now);
  updatePearlSurface();

  pearlGroup.rotation.y += animateMotion ? 0.0014 : 0;
  controls.update();
  composer.render();
  requestAnimationFrame(animate);
}

function handleResize() {
  const width = window.innerWidth;
  const height = window.innerHeight;
  renderer.setSize(width, height);
  composer.setSize(width, height);
  bloomPass.setSize(width, height);
  camera.aspect = width / height;
  camera.updateProjectionMatrix();
  if (width < 760) {
    camera.position.z = 10.2;
    pearlGroup.position.set(0.14, 0.1, 0);
    pearlGroup.scale.setScalar(0.76);
  } else if (width < 1040) {
    camera.position.z = 9.2;
    pearlGroup.position.set(0.9, -0.2, 0);
    pearlGroup.scale.setScalar(0.88);
  } else {
    pearlGroup.position.set(0, -0.08, 0);
    pearlGroup.scale.setScalar(1);
  }
}

window.addEventListener("resize", handleResize);
setMode("cooked");
current = { ...target };
handleResize();
updateReadout(target);
animate();

if (window.lucide) {
  window.lucide.createIcons();
}
</script>
</body>
</html>
